version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grostop
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./grostop.sql:/docker-entrypoint-initdb.d/grostop.sql

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=grostop
    depends_on:
      - db

volumes:
  db_data: